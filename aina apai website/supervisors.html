<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Әзірленуде</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* HEADER */
header {
    background: white;
    padding: 20px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 25px;
}

nav a {
    text-decoration: none;
    color: #2c3e50;
    font-weight: 500;
}

nav a:hover {
    color: #8b1e2d;
}

/* CENTER MESSAGE */
body {
    background-color: #f4f5f7;
}

.main {
    height: calc(100vh - 80px);
    display: flex;
    justify-content: center;
    align-items: center;
}

.message {
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    color: #2c3e50;
}
</style>
</head>

<body>

<header>
    <div class="container nav">
        <div class="logo">
            <img src="logo.png" alt="logo" style="width:120px;">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Басты бет</a></li>
                <li><a href="events.html">Іс-шаралар</a></li>
                <li><a href="plans.html">Жоспарлар</a></li>
                <li><a href="achievements.html">Жетістіктер</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="main">
    <div class="message">
        Бұл бет әзірленуде.<br>
        Кейін оралуыңызды сұраймыз.
    </div>
</div>

</body>
</html>
