<script>
const firebaseConfig = {
  apiKey: "AIzaSyAkSfVGVfDs8AHiM_2NCDl0MEhmf_YbSew",
  authDomain: "nis-dorm.firebaseapp.com",
  projectId: "nis-dorm",
  storageBucket: "nis-dorm.appspot.com",
  messagingSenderId: "34661486520",
  appId: "1:34661486520:web:3b6d3bd38c2d6fa7e0c94d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const container = document.getElementById("achievements-list");

/* 👤 fake user id */
let userId = localStorage.getItem("userId");
if (!userId) {
    userId = "user_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("userId", userId);
}

/* 🔥 REALTIME */
db.collection("achievements")
  .orderBy("createdAt", "desc")
  .onSnapshot(snapshot => {
      container.innerHTML = "";

      snapshot.forEach(doc => {
          const a = doc.data();
          const userReaction = a.reactionsByUser?.[userId] || null;

          const block = document.createElement("div");
          block.className = "achievement";

          block.innerHTML = `
              <img src="${a.image || 'default.jpg'}">

              <div>
                  <h2>${a.title || ""}</h2>
                  <p>${a.description || ""}</p>

                  <div class="reactions">
                      <button onclick="toggleReaction('${doc.id}','likes')">
                          👍 ${a.likes || 0} ${userReaction === "likes" ? "✓" : ""}
                      </button>

                      <button onclick="toggleReaction('${doc.id}','loves')">
                          ❤️ ${a.loves || 0} ${userReaction === "loves" ? "✓" : ""}
                      </button>

                      <button onclick="toggleReaction('${doc.id}','fires')">
                          🔥 ${a.fires || 0} ${userReaction === "fires" ? "✓" : ""}
                      </button>
                  </div>
              </div>
          `;

          container.appendChild(block);
      });
  });

/* ⚡ TOGGLE LOGIC */
async function toggleReaction(id, newReaction){
    const ref = db.collection("achievements").doc(id);

    await db.runTransaction(async (t) => {
        const doc = await t.get(ref);
        const data = doc.data();

        const reactionsByUser = data.reactionsByUser || {};
        const oldReaction = reactionsByUser[userId];

        let updates = {};

        // 1. если нажал на ту же реакцию → убрать
        if (oldReaction === newReaction) {
            updates[`reactionsByUser.${userId}`] = firebase.firestore.FieldValue.delete();
            updates[oldReaction] = firebase.firestore.FieldValue.increment(-1);
        } 
        else {
            // 2. убрать старую реакцию
            if (oldReaction) {
                updates[oldReaction] = firebase.firestore.FieldValue.increment(-1);
            }

            // 3. поставить новую
            updates[newReaction] = firebase.firestore.FieldValue.increment(1);
            updates[`reactionsByUser.${userId}`] = newReaction;
        }

        t.update(ref, updates);
    });
}
</script>
