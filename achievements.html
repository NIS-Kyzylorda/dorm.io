<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жетістіктер</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9; /* Скриншоттағыдай ашық фон */
            padding-top: 40px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        /* Тақырып стилі */
        .page-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #000;
        }

        /* Карточка стилі */
        .achievement-card {
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            padding: 15px;
            gap: 20px;
        }

        .achievement-image {
            width: 280px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .achievement-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .achievement-info h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #000;
        }

        .achievement-info p {
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
        }

        /* Реакциялар (түймелер) */
        .reactions-bar {
            display: flex;
            gap: 10px;
        }

        .reaction-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: #f0f2f5;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .reaction-btn:hover {
            background: #e4e6e9;
        }

        /* Мобильді нұсқа */
        @media (max-width: 768px) {
            .achievement-card {
                flex-direction: column;
            }
            .achievement-image {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="page-title">Жетістіктер</h1>
        
        <div id="achievements-list"></div>
    </div>

    <script>
        // 1. Firebase инициализациясы
        const firebaseConfig = {
            apiKey: "AIzaSyAkSfVGVfDs8AHiM_2NCDl0MEhmf_YbSew",
            authDomain: "nis-dorm.firebaseapp.com",
            projectId: "nis-dorm",
            storageBucket: "nis-dorm.appspot.com",
            messagingSenderId: "34661486520",
            appId: "1:34661486520:web:3b6d3bd38c2d6fa7e0c94d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const listElement = document.getElementById("achievements-list");

        // 2. Мәліметтерді шығару функциясы
        async function loadAchievements() {
            try {
                // "createdAt" бойынша сұрыптап алу
                const snapshot = await db.collection("achievements").orderBy("createdAt", "desc").get();
                listElement.innerHTML = ""; // Тазалау

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    const card = document.createElement("div");
                    card.className = "achievement-card";

                    card.innerHTML = `
                        <img src="${data.image || 'https://via.placeholder.com/280x180'}" class="achievement-image" alt="image">
                        <div class="achievement-info">
                            <h2>${data.title}</h2>
                            <p>${data.description || ''}</p>
                            <div class="reactions-bar">
                                <button class="reaction-btn" onclick="addReaction('${id}', 'likes')">
                                    👍 <span>${data.likes || 0}</span>
                                </button>
                                <button class="reaction-btn" onclick="addReaction('${id}', 'loves')">
                                    ❤️ <span>${data.loves || 0}</span>
                                </button>
                                <button class="reaction-btn" onclick="addReaction('${id}', 'fires')">
                                    🔥 <span>${data.fires || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    listElement.appendChild(card);
                });
            } catch (error) {
                console.error("Деректерді жүктеу қатесі:", error);
            }
        }

        // 3. Реакция қосу функциясы
        async function addReaction(id, type) {
            const docRef = db.collection("achievements").doc(id);
            
            try {
                // Firebase-тегі мәнді 1-ге арттыру (increment)
                await docRef.update({
                    [type]: firebase.firestore.FieldValue.increment(1)
                });
                
                // Бетті қайта жүктемей-ақ жаңарту (render)
                loadAchievements();
            } catch (err) {
                console.error("Реакция қосу мүмкін болмады:", err);
            }
        }

        // Бастапқы жүктеу
        loadAchievements();

    </script>
</body>
</html>
