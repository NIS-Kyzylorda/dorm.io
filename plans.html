<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жоспарлар</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f5f7;
color:#2c3e50;
}

/* HEADER */
header {
    background: white;
    padding: 20px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img{
width:120px;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 30px;
}

nav a {
    text-decoration: none;
    color: #2c3e50;
    font-weight: 500;
}

nav a:hover {
    color: #8b1e2d;
}

/* LAYOUT */
.container{
width:90%;
max-width:1200px;
margin:auto;
margin-top:30px;
}

/* MONTH NAV */
.month-nav{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin-bottom:20px;
}

.month-nav button{
padding:8px 14px;
border:none;
background:#1f3c88;
color:white;
border-radius:6px;
cursor:pointer;
}

/* WEEKDAYS */
.weekdays{
display:grid;
grid-template-columns:repeat(7,1fr);
margin-bottom:10px;
}

.weekdays div{
text-align:center;
font-weight:bold;
color:#1f3c88;
}

/* CALENDAR */
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

/* DAY */
.day{
background:white;
border-radius:8px;
padding:20px 10px;
text-align:center;
position:relative;
cursor:pointer;
transition:0.2s;
}

.day:hover{
background:#e0e0e0;
}

/* HAS PLAN */
.has-plan {
    background: #dff5e1;
    border: 2px solid #2ecc71;
}

/* TODAY */
.today{
border:2px solid #1f3c88;
}

/* TOOLTIP */
.tooltip{
position:absolute;
bottom:105%;
left:50%;
transform:translateX(-50%);
background:#8b1e2d;
color:white;
padding:10px;
border-radius:6px;
font-size:14px;
width:200px;
display:none;
z-index:10;
}

</style>
</head>

<body>

<header>
    <div class="container nav">
        <div class="logo">
            <img src="logo.png" alt="logo">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Басты бет</a></li>
                <li><a href="events.html">Іс-шаралар</a></li>
                <li><a href="plans.html">Жоспарлар</a></li>
                <li><a href="achievements.html">Жетістіктер</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="container">

<h1 style="text-align:center;margin-bottom:20px;">Жоспарлар</h1>

<div class="month-nav">
<button onclick="changeMonth(-1)">◀</button>
<h2 id="monthTitle"></h2>
<button onclick="changeMonth(1)">▶</button>
</div>

<div class="weekdays">
<div>Дүй</div>
<div>Сей</div>
<div>Сәр</div>
<div>Бей</div>
<div>Жұм</div>
<div>Сен</div>
<div>Жек</div>
</div>

<div class="calendar" id="calendar"></div>

</div>

<script><script>
let currentDate = new Date();

const firebaseConfig = {
  apiKey: "AIzaSyAkSfVGVfDs8AHiM_2NCDl0MEhmf_YbSew",
  // ... остальные данные конфига
};

// 1. Инициализация (уже есть у тебя)
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let plans = {};

// 2. ВСТАВЛЯЙ СЮДА (Заменяешь свою старую функцию loadPlansFromFirebase на эту)
generateCalendar(); 

async function loadPlansFromFirebase(){
    try {
        const snapshot = await db.collection("plans").get();
        plans = {};
        snapshot.forEach(doc => {
            const data = doc.data();
            plans[data.date] = data.text;
        });
        generateCalendar(); 
    } catch (error) {
        console.error("Деректерді жүктеу қатесі:", error);
    }
}

// 3. Дальше идут остальные функции (generateCalendar, changeMonth и т.д.), которые у тебя уже написаны
function generateCalendar() {
   // твой код функции...
}

// 4. В самом конце скрипта оставь вызов загрузки
loadPlansFromFirebase();

db.collection("plans").onSnapshot(()=>{
    loadPlansFromFirebase();
});
</script></script>

</body>
</html>
